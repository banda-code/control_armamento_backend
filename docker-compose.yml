services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  db:
    image: postgres:18-alpine
    container_name: armamento_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-control_armamento}
      POSTGRES_USER: ${DB_USER:-armamento_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - armamento_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-armamento_user} -d ${DB_NAME:-control_armamento}"
        ]
      interval: 5s
      timeout: 5s
      retries: 15

    networks:
      - fortaleza_network


  # ==========================================================
  # DJANGO
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: armamento_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
      "

    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy

    networks:
      - fortaleza_network


  # ==========================================================
  # REACT + NGINX
  # ==========================================================

  frontend:
    build:
      context: ../control_armamento_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: armamento_frontend
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8085}:80"

    volumes:
      - ./media:/var/www/media:ro
      - ./staticfiles:/var/www/static:ro

    depends_on:
      - backend

    networks:
      - fortaleza_network


# ============================================================
# VOLUMES
# ============================================================

volumes:
  armamento_postgres_data:


# ============================================================
# NETWORK
# ============================================================

networks:
  fortaleza_network:
    driver: bridge
